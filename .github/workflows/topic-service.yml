name: Build Topic Service

on:
  push:
    branches:
      - main
    paths:
      - 'topic-service/**'
      - ".github/workflows/topic-service.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push topic service image
        uses: docker/build-push-action@v7
        with:
          context: ./topic-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/glorfeed-topic-service:latest
            ghcr.io/${{ github.repository_owner }}/glorfeed-topic-service:${{ github.sha }}


