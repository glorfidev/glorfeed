name: Build and Deploy Topic Service

on:
  push:
    branches:
      - main
    paths:
      - 'topic-service/**'
      - ".github/workflows/topic-service.yml"
      - 'infra/prod/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after building (disable to publish the image only)
        type: boolean
        required: true
        default: true

concurrency:
  group: glorfeed-topic-service-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push topic service image
        uses: docker/build-push-action@v7
        with:
          context: ./topic-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/glorfeed-topic-service:latest
            ghcr.io/${{ github.repository_owner }}/glorfeed-topic-service:${{ github.sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/infra.yml
