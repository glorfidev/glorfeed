name: Deploy Infra

on:
  workflow_call:

concurrency:
  group: glorfeed-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, glorfeed-prod]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install deployment files
        run: |
          set -euo pipefail
          install -d /opt/glorfeed/infra/prod
          install -m 644 infra/prod/docker-compose.yml /opt/glorfeed/infra/prod/docker-compose.yml
          install -m 644 infra/prod/Caddyfile /opt/glorfeed/infra/prod/Caddyfile
          install -d /opt/glorfeed/infra/prod/postgres/init
          install -m 755 infra/prod/postgres/init/01-create-service-databases.sh /opt/glorfeed/infra/prod/postgres/init/01-create-service-databases.sh
          install -m 755 infra/prod/deploy.sh /opt/glorfeed/infra/prod/deploy.sh
          install -m 755 infra/prod/provision-cdc.sh /opt/glorfeed/infra/prod/provision-cdc.sh
          install -m 755 infra/prod/register_connectors.py /opt/glorfeed/infra/prod/register_connectors.py
          install -m 755 infra/prod/smoke-crud-projection.py /opt/glorfeed/infra/prod/smoke-crud-projection.py
          install -d /opt/glorfeed/infra/prod/connectors
          install -m 644 infra/prod/connectors/topic-outbox.json /opt/glorfeed/infra/prod/connectors/topic-outbox.json
          install -m 644 infra/prod/connectors/research-outbox.json /opt/glorfeed/infra/prod/connectors/research-outbox.json

      - name: Apply production configuration
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/glorfeed-docker-config
        run: |
          set -euo pipefail
          install -d -m 700 "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cd /opt/glorfeed/infra/prod
          ./deploy.sh
