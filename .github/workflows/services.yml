name: Build Services and Deploy Infra

on:
  push:
    branches:
      - main
    paths:
      - 'topic-service/**'
      - 'research-service/**'
      - ".github/workflows/services.yml"
      - '.github/workflows/build-service-image.yml'
      - 'infra/prod/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after building (disable to publish the image only)
        type: boolean
        required: true
        default: true

concurrency:
  group: glorfeed-topic-service-build
  cancel-in-progress: false

jobs:
  build-topic-service:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-service-image.yml
    with:
      context: ./topic-service
      image-name: glorfeed-topic-service

  build-research-service:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-service-image.yml
    with:
      context: ./research-service
      image-name: glorfeed-research-service

  deploy:
    needs: [build-topic-service, build-research-service]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/infra.yml
