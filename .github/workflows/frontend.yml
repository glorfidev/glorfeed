name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after building (disable to publish the image only)
        type: boolean
        required: true
        default: true

concurrency:
  group: glorfeed-frontend-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/glorfeed-frontend:latest
            ghcr.io/${{ github.repository_owner }}/glorfeed-frontend:${{ github.sha }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: [self-hosted, Linux, ARM64, glorfeed-prod]
    concurrency:
      group: glorfeed-production-deploy
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy frontend
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/glorfeed-docker-config
        run: |
          set -euo pipefail
          install -d -m 700 "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cd /opt/glorfeed/infra/prod
          docker compose pull frontend
          docker compose up -d --no-deps frontend

