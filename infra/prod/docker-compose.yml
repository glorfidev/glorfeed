services:
  postgres:
    image: postgres:18.1
    restart: unless-stopped
    # Debezium will read outbox inserts through logical decoding.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the server .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server .env file}
      POSTGRES_DB: postgres
      TOPIC_DB_USER: ${TOPIC_DB_USER:?Set TOPIC_DB_USER in the server .env file}
      TOPIC_DB_PASSWORD: ${TOPIC_DB_PASSWORD:?Set TOPIC_DB_PASSWORD in the server .env file}
      RESEARCH_DB_USER: ${RESEARCH_DB_USER:?Set RESEARCH_DB_USER in the server .env file}
      RESEARCH_DB_PASSWORD: ${RESEARCH_DB_PASSWORD:?Set RESEARCH_DB_PASSWORD in the server .env file}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    image: ghcr.io/glorfidev/glorfeed-frontend:latest
    restart: unless-stopped
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.glorfindela.dev}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-glorfeed}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-glorfeed-frontend}
    networks:
      - web

  topic-service:
    image: ghcr.io/glorfidev/glorfeed-topic-service:latest
    restart: unless-stopped
    environment:
      TOPIC_DB_URL: jdbc:postgresql://postgres:5432/glorfeed_topic
      TOPIC_DB_USER: ${TOPIC_DB_USER:?Set TOPIC_DB_USER in the server .env file}
      TOPIC_DB_PASSWORD: ${TOPIC_DB_PASSWORD:?Set TOPIC_DB_PASSWORD in the server .env file}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-https://auth.glorfindela.dev/realms/glorfeed}
      AUTH_JWK_SET_URI: ${AUTH_JWK_SET_URI:-https://auth.glorfindela.dev/realms/glorfeed/protocol/openid-connect/certs}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-glorfeed-topic-service}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - web

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:
  backend:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
