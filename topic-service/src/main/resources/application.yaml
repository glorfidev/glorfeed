spring:
  application:
    name: topic-service
  datasource:
    url: ${TOPIC_DB_URL}
    username: ${TOPIC_DB_USER}
    password: ${TOPIC_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:https://auth.glorfindela.dev/realms/glorfeed}

app:
  security:
    jwk-set-uri: ${AUTH_JWK_SET_URI:https://auth.glorfindela.dev/realms/glorfeed/protocol/openid-connect/certs}
    audience: ${AUTH_AUDIENCE:glorfeed-topic-service}

logging:
  config: classpath:logging/logback-spring.xml
  graylog:
    enabled: ${GRAYLOG_ENABLED:false}
    host: ${GRAYLOG_HOST:127.0.0.1}
    port: ${GRAYLOG_PORT:12201}
    source: topic-service
